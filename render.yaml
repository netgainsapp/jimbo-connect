services:
  - type: web
    name: jimbo-connect-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MONGO_URL
        sync: false  # set in Render dashboard (Atlas connection string)
      - key: DB_NAME
        value: jimbo_connect
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@intro-connect.com
      - key: ADMIN_PASSWORD
        sync: false  # set in Render dashboard
      - key: FRONTEND_URL
        sync: false  # set to your deployed frontend URL (Vercel or Render Static)
      - key: RESEND_API_KEY
        sync: false  # paste from resend.com → API Keys
      - key: EMAIL_FROM
        value: "Intro Connect <hello@intro-connect.com>"
      - key: RESEND_WEBHOOK_SECRET
        sync: false  # resend.com → Webhooks signing secret (whsec_...); blank = webhook disabled
      - key: API_PUBLIC_URL
        value: "https://jimbo-connect-api-rdkp.onrender.com"
      - key: ERROR_HUB_KEY
        sync: false  # Signal Scout error-hub per-project key (ssk_...); blank = reporting disabled
      # The scheduled ticks (blog, news, nurture, invites) live in GitHub
      # Actions and authenticate with this shared secret. It must be the SAME
      # value as the BLOG_TICK_SECRET repo secret. Unset here means every tick
      # gets a 401, because _tick_authorized fails closed; that is the correct
      # behaviour and it is also completely silent, so it went unnoticed.
      - key: BLOG_TICK_SECRET
        sync: false  # must match the GitHub Actions repo secret exactly
      # Blog and news generation. Absent means both ticks are harmless no-ops
      # that report {"skipped": "no_api_key"} rather than failing.
      - key: ANTHROPIC_API_KEY
        sync: false  # console.anthropic.com -> API keys

  - type: web
    name: jimbo-connect-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false  # live API: https://jimbo-connect-api-rdkp.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: jimbo-connect-marketing
    runtime: static
    rootDir: marketing
    buildCommand: yarn install && yarn build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
