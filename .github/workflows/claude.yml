# @claude in any issue or PR comment hands the task to Claude Code: it reads
# the thread, makes the change on a branch, and opens a PR — the phone-only
# resolution path for error-hub issues. Requires the Claude GitHub App
# installed on this account and the ANTHROPIC_API_KEY repo secret.
name: Claude

# Comment-only triggers ON PURPOSE: auto-filed error-hub issues contain the
# literal "@claude" in their body, so an issues:opened trigger would spawn a
# paid Claude run for every error group. A human comment is the dispatch.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
