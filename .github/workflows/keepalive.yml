# Keeps the free-tier Render API instance warm so visitors and Stripe
# webhooks never hit the ~40s cold start. Render idles a service after 15
# quiet minutes; a ping every 5 keeps it awake, and one always-on service
# fits inside the free tier's monthly instance hours.
#
# Honest limits: GitHub cron ticks can be delayed several minutes under
# load, so a cold start can occasionally slip through. This is the free
# best effort; the real fix remains the paid always-on instance.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://jimbo-connect-api-rdkp.onrender.com/api/health)
          echo "health: HTTP $code"
          test "$code" = "200"
